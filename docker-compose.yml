# Levanta PostgreSQL + la aplicación completa en http://localhost:8000
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ilustra
      POSTGRES_USER: ilustra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ilustra-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilustra -d ilustra"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ilustra:${POSTGRES_PASSWORD:-ilustra-local}@db:5432/ilustra
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - imagecache:/data/image_cache

volumes:
  pgdata:
  imagecache:
