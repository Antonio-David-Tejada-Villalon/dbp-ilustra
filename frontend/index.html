<!doctype html>
<html lang="es" data-theme="papel">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="DBP Ilustra: ilustradores, dibujantes, historietistas y creadores de manga de San Juan." />
    <meta name="theme-color" content="#5b2bd9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ilustra" />
    <title>DBP Ilustra</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DBP Ilustra" />
    <meta property="og:locale" content="es_AR" />
    <meta id="og-title" property="og:title" content="DBP Ilustra" />
    <meta id="og-description" property="og:description" content="Ilustradores, dibujantes, historietistas y creadores de manga de San Juan publican su obra en DBP Ilustra." />
    <meta id="og-image" property="og:image" content="https://dbp-ilustra.vercel.app/icon-512.png" />
    <meta id="og-url" property="og:url" content="https://dbp-ilustra.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="twitter-title" name="twitter:title" content="DBP Ilustra" />
    <meta id="twitter-description" name="twitter:description" content="Ilustradores, dibujantes, historietistas y creadores de manga de San Juan publican su obra en DBP Ilustra." />
    <meta id="twitter-image" name="twitter:image" content="https://dbp-ilustra.vercel.app/icon-512.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ilustra-theme") || "auto";
          if (t === "auto") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "nocturno" : "papel";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
        }
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
